<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ランダム・ストリートビュー</title>
<style>
  :root {
    --bg: #F4F5F6;
    --surface: #FFFFFF;
    --text: #1D2125;
    --muted: #5B636B;
    --line: #D5D9DD;
    --accent: #F2C230;
    --accent-text: #1D2125;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1E2226;
      --surface: #2A2F34;
      --text: #ECEEF0;
      --muted: #A3ABB3;
      --line: #3B4248;
      --accent: #F2C230;
      --accent-text: #1D2125;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .view { flex: 1; position: relative; min-height: 0; }
  .view iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .notice {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    padding: 24px; text-align: center; line-height: 1.8; color: var(--muted);
  }
  .notice code {
    background: var(--surface); border: 1px solid var(--line);
    padding: 2px 6px; border-radius: 4px; color: var(--text);
  }
  .bar {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 20px 10px;
    background: var(--surface);
    border-top: 4px solid var(--accent);
  }
  .place { flex: 1; min-width: 0; }
  .place h1 {
    margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: 0.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .place p { margin: 2px 0 0; font-size: 0.875rem; color: var(--muted); }
  .maps-link { font-size: 0.875rem; color: var(--muted); white-space: nowrap; }
  button {
    font: inherit; font-weight: 700;
    padding: 10px 20px; border: 0; border-radius: 6px;
    background: var(--accent); color: var(--accent-text);
    cursor: pointer; white-space: nowrap;
  }
  button:hover { filter: brightness(0.95); }
  button:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  .credit {
    margin: 0; padding: 0 20px 10px;
    background: var(--surface);
    font-size: 0.75rem; color: var(--muted);
  }
  .credit a { color: var(--muted); }
  @media (max-width: 560px) {
    .bar { flex-wrap: wrap; }
    .place { flex-basis: 100%; }
    button { flex: 1; }
  }
</style>
</head>
<body>

<main class="view">
  <iframe id="sv" title="ストリートビュー" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
  <div class="notice" id="notice"><div id="noticeText"></div></div>
</main>

<footer>
  <div class="bar">
    <div class="place">
      <h1 id="title">読み込み中</h1>
      <p id="detail"></p>
    </div>
    <a class="maps-link" id="mapsLink" href="#" target="_blank" rel="noopener">Googleマップで開く</a>
    <button id="next" type="button" disabled>別の場所を見る</button>
  </div>
  <p class="credit">地名データ: <a href="https://www.geonames.org/" target="_blank" rel="noopener">GeoNames</a>（<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>）</p>
</footer>

<script>
  // ここにGoogle Cloudで発行したAPIキーを入れる（Maps Embed APIを有効化しておくこと）
  const API_KEY = "";

  // 都市の中心から、この距離（メートル）以内でランダムに座標をずらす
  const MAX_OFFSET_M = 1000;

  // 都市データ（index.html と同じ場所に置く）
  const DATA_URL = "cities.json";

  const iframe = document.getElementById("sv");
  const titleEl = document.getElementById("title");
  const detailEl = document.getElementById("detail");
  const mapsLink = document.getElementById("mapsLink");
  const nextBtn = document.getElementById("next");
  const notice = document.getElementById("notice");
  const noticeText = document.getElementById("noticeText");

  // 全大陸の国を1列に並べた一覧
  // 国を均等に選ぶ = 大陸を「国の数に比例した確率」で選ぶのと同じになる
  let COUNTRIES = [];

  function showNotice(html) {
    noticeText.innerHTML = html;
    notice.style.display = "flex";
  }

  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  // 都市の中心から、円の中に均等に散らばるようにランダムな座標を作る
  function randomPointNear(lat, lng, maxMeters) {
    const r = maxMeters * Math.sqrt(Math.random());   // 中心に偏らないよう平方根をとる
    const theta = Math.random() * 2 * Math.PI;
    const dLat = (r * Math.cos(theta)) / 111320;      // 緯度1度 ≒ 111.32km
    const dLng = (r * Math.sin(theta)) / (111320 * Math.cos(lat * Math.PI / 180));
    return { lat: lat + dLat, lng: lng + dLng };
  }

  function showRandom() {
    // 1. 国を均等に選ぶ
    const country = pick(COUNTRIES);
    // 2. その国の都市を均等に選ぶ  [都市名, 緯度, 経度]
    const [cityName, cLat, cLng] = pick(country.cities);
    // 3. 都市の中心からランダムにずらす
    const p = randomPointNear(cLat, cLng, MAX_OFFSET_M);
    const heading = Math.floor(Math.random() * 360);

    titleEl.textContent = cityName + " 付近";
    detailEl.textContent = country.name + "・" + country.continentName;

    const loc = p.lat.toFixed(6) + "," + p.lng.toFixed(6);
    const params = new URLSearchParams({
      key: API_KEY,
      location: loc,
      heading: String(heading),
      pitch: "0",
      fov: "90"
    });
    iframe.src = "https://www.google.com/maps/embed/v1/streetview?" + params.toString();

    mapsLink.href = "https://www.google.com/maps/@?api=1&map_action=pano&viewpoint="
      + loc + "&heading=" + heading;
  }

  async function init() {
    if (!API_KEY || API_KEY === "YOUR_API_KEY") {
      titleEl.textContent = "APIキー未設定";
      showNotice("APIキーが設定されていません。<br>HTML内の <code>API_KEY</code> に、Google Cloudで発行したキーを入れてください。");
      return;
    }

    try {
      const res = await fetch(DATA_URL);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();

      // 大陸 → 国 の階層を、国の一覧に展開する
      for (const continent of Object.values(data.continents)) {
        for (const c of Object.values(continent.countries)) {
          if (c.cities.length > 0) {
            COUNTRIES.push({ name: c.name, continentName: continent.name, cities: c.cities });
          }
        }
      }
      if (COUNTRIES.length === 0) throw new Error("都市データが空です");
    } catch (e) {
      titleEl.textContent = "都市データを読み込めません";
      showNotice("<code>cities.json</code> を読み込めませんでした。<br>index.html と同じ場所に置かれているか確認してください。");
      return;
    }

    nextBtn.disabled = false;
    showRandom();
  }

  nextBtn.addEventListener("click", showRandom);
  init();
</script>
</body>
</html>
